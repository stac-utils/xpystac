[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "xpystac"
authors = [
    {name = "Julia Signell", email = "jsignell@gmail.com"}
]
classifiers = [ "License :: OSI Approved :: MIT License",]
dependencies = [
    "xarray",
    "pystac-core>=1.16",
]
requires-python = ">=3.12"
description = "Extend xarray.open_dataset to accept pystac objects"
license = {text = "MIT"}
readme = "README.md"
dynamic = ["version"]

[project.urls]
Home = "https://github.com/stac-utils/xpystac"
Repository = "https://github.com/stac-utils/xpystac"

[dependency-groups]
dev = [
    "adlfs>=2024.12.0",
    "aiohttp>=3.12.15",
    "dask>=2025.9.1",
    "fsspec>=2025.3.0",
    "icechunk>=1.1.5",
    "ipdb>=0.13.13",
    "ipython>=9.5.0",
    "kerchunk>=0.2.7",
    "mypy>=2.4.1",
    "planetary-computer>=1.0.0",
    "pre-commit>=4.0.1",
    "pystac>=1.16",
    "pystac-client>=0.8.6",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "pyupgrade>=3.22.0",
    "requests>=2.32.3",
    "rioxarray>=0.18.2",
    "ruff>=0.17.4",
    "rustac>=0.9.17",
    "urllib3>=2.3.0",
    "zarr>2",
]

[project.entry-points."xarray.backends"]
stac = "xpystac.xarray_plugin:STACBackend"

[tool.setuptools.packages.find]
include = [
    "xpystac",
]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "W", "I", "TID252" ]
target-version = "py312"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[[tool.mypy.overrides]]
module = ["planetary_computer", "rasterio.*", "fsspec.*"]
ignore_missing_imports = true
